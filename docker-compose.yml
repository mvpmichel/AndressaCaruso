name: site-andressa

services:
  web:
    build: .
    container_name: site-andressa
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - '5180:5173'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - firebase_config:/root/.config

volumes:
  node_modules:
  firebase_config:
